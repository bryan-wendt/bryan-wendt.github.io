<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .header-text { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .body-text { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .label-text { fill: #f59e0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .hull { fill: #0f172a; stroke: #64748b; stroke-width: 2; }
      .plug { fill: #334155; stroke: #38bdf8; stroke-width: 2; }
      .driver-pin { fill: #38bdf8; stroke: #0284c7; stroke-width: 1.5; }
      .key-pin { fill: #f59e0b; stroke: #d97706; stroke-width: 1.5; }
      .pick { fill: #94a3b8; stroke: #cbd5e1; stroke-width: 2; }
      .shear-line { stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .arrow { stroke: #f59e0b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-amber); }
      .lift-arrow { stroke: #10b981; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .torque-arrow { stroke: #38bdf8; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="840" height="420" fill="#0b1120" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <text x="30" y="38" class="title">Single Pin Picking (SPP) Mechanics &amp; Binding Order</text>
  <text x="30" y="58" class="subtitle">Rotational plug torque binds individual pin chambers sequentially across manufacturing tolerances</text>

  <!-- Step 1: Rotational Torque & Binding Pin -->
  <g transform="translate(40, 80)">
    <rect width="360" height="310" class="card-bg"/>
    <text x="180" y="28" class="header-text">1. Tension Applied &amp; Binding State</text>

    <g transform="translate(70, 45)">
      <!-- Bible -->
      <rect x="20" y="0" width="180" height="70" class="hull" rx="4"/>
      <!-- Plug with slight offset under tension -->
      <rect x="25" y="70" width="175" height="85" class="plug" rx="4"/>
      <line x1="0" y1="70" x2="220" y2="70" class="shear-line"/>

      <!-- Chamber 1: Free Pin (Loose) -->
      <rect x="45" y="20" width="22" height="45" class="driver-pin"/>
      <rect x="45" y="75" width="22" height="40" class="key-pin"/>

      <!-- Chamber 2: BINDING PIN (Caught between plug edge and hull) -->
      <rect x="120" y="20" width="22" height="48" class="driver-pin"/>
      <rect x="123" y="72" width="22" height="40" class="key-pin"/>
    </g>

    <!-- Rotational Torque Arrow -->
    <path d="M 270 175 C 290 165 295 140 280 125" class="torque-arrow"/>
    <text x="295" y="150" class="label-text" fill="#38bdf8">TENSION</text>

    <!-- Arrow to binding pin -->
    <line x1="280" y1="105" x2="215" y2="105" class="arrow"/>
    <text x="285" y="109" class="label-text">BINDING PIN</text>

    <text x="180" y="245" class="body-text" text-anchor="middle">Plug offset creates a ledge for one pin.</text>
    <text x="180" y="265" class="body-text" text-anchor="middle">Non-binding pins feel springy and loose.</text>
    <text x="180" y="285" class="body-text" text-anchor="middle" fill="#f59e0b">The binding pin feels rigid to pick pressure.</text>
  </g>

  <!-- Step 2: Lifting to Shear & Setting -->
  <g transform="translate(440, 80)">
    <rect width="360" height="310" class="card-bg"/>
    <text x="180" y="28" class="header-text">2. Lifted to Shear &amp; Driver Set</text>

    <g transform="translate(70, 45)">
      <rect x="20" y="0" width="180" height="70" class="hull" rx="4"/>
      <rect x="25" y="70" width="175" height="85" class="plug" rx="4"/>
      <line x1="0" y1="70" x2="220" y2="70" class="shear-line"/>

      <!-- Chamber 1: Still unset -->
      <rect x="45" y="20" width="22" height="45" class="driver-pin"/>
      <rect x="45" y="75" width="22" height="40" class="key-pin"/>

      <!-- Chamber 2: SET PIN (Driver pin rests on plug ledge above shear) -->
      <rect x="120" y="20" width="22" height="45" class="driver-pin"/>
      <rect x="123" y="75" width="22" height="40" class="key-pin"/>

      <!-- Pick tip lifting key pin -->
      <path d="M 90 145 L 134 118 L 134 115" class="pick"/>
    </g>

    <!-- Pick lift arrow -->
    <line x1="205" y1="180" x2="205" y2="155" class="lift-arrow"/>
    <text x="215" y="172" class="label-text" fill="#10b981">LIFT</text>

    <!-- Arrow to resting driver pin -->
    <line x1="280" y1="105" x2="215" y2="105" class="arrow"/>
    <text x="285" y="109" class="label-text">DRIVER RESTS ON LEDGE</text>

    <text x="180" y="245" class="body-text" text-anchor="middle">Driver pin clears the shear line.</text>
    <text x="180" y="265" class="body-text" text-anchor="middle">Rotational tension holds driver in bible.</text>
    <text x="180" y="285" class="body-text" text-anchor="middle" fill="#10b981">Distinct click &amp; next pin in sequence binds.</text>
  </g>
</svg>
