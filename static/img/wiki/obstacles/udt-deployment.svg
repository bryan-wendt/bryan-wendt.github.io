<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .door { fill: #1e293b; stroke: #64748b; stroke-width: 2; }
      .floor { fill: #020617; stroke: #475569; stroke-width: 2; }
      .handle { fill: #94a3b8; stroke: #cbd5e1; stroke-width: 2; }
      .udt-rod { stroke: #38bdf8; stroke-width: 3.5; fill: none; }
      .udt-wire { stroke: #f59e0b; stroke-width: 2.5; fill: none; stroke-dasharray: 4 2; }
      .arrow { stroke: #f59e0b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-amber); }
      .pull-arrow { stroke: #10b981; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .label { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      .desc { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; }
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="840" height="420" fill="#0b1120" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <text x="30" y="38" class="title">Under-Door Tool (UDT) Deployment Vector</text>
  <text x="30" y="58" class="subtitle">Bypassing exterior door locks via the undercut gap and interior lever handle</text>

  <g transform="translate(80, 90)">
    <!-- Floor Line -->
    <line x1="0" y1="260" x2="680" y2="260" class="floor"/>
    <text x="50" y="280" class="desc">EXTERIOR (ATTACKER)</text>
    <text x="550" y="280" class="desc">INTERIOR (SECURE AREA)</text>

    <!-- Door Leaf in Cross Section -->
    <rect x="250" y="20" width="40" height="225" class="door" rx="4"/>
    
    <!-- Interior Lever Handle -->
    <circle cx="290" cy="110" r="14" class="handle"/>
    <path d="M 290 105 L 380 105 L 380 120 L 290 120 Z" class="handle"/>
    
    <!-- Undercut Gap (between door bottom y=245 and floor y=260) -->
    <rect x="245" y="245" width="50" height="15" fill="#38bdf8" fill-opacity="0.15"/>
    <line x1="220" y1="252" x2="245" y2="252" class="arrow"/>
    <text x="215" y="250" class="label" text-anchor="end" fill="#38bdf8">UNDERCUT GAP</text>
    <text x="215" y="265" class="desc" text-anchor="end">3/8" - 3/4" clearance</text>

    <!-- Under Door Tool (UDT) -->
    <!-- Rod coming from exterior, under door, curving up interior -->
    <path d="M 60 252 L 270 252 C 340 252 380 230 380 140 L 380 95" class="udt-rod"/>
    <!-- Wire Loop over lever handle -->
    <path d="M 380 95 C 380 80 340 80 340 105 C 340 125 380 135 380 140" class="udt-wire"/>

    <!-- Pull String Action Arrow -->
    <line x1="340" y1="125" x2="340" y2="165" class="pull-arrow"/>
    <text x="350" y="160" class="label" fill="#10b981">PULL DOWN</text>

    <!-- Exterior Handle of Tool -->
    <rect x="30" y="244" width="30" height="16" rx="4" fill="#38bdf8"/>
    <line x1="30" y1="230" x2="45" y2="244" class="arrow"/>
    <text x="25" y="225" class="label" text-anchor="end">OPERATOR TENSION</text>

    <!-- Handle Callout Arrow -->
    <line x1="520" y1="112" x2="390" y2="112" class="arrow"/>
    <text x="530" y="110" class="label">INTERIOR LEVER</text>
    <text x="530" y="128" class="desc">Single-motion life safety egress</text>
    <text x="530" y="145" class="desc" fill="#10b981">Depression retracts latch bolt</text>
  </g>
</svg>
