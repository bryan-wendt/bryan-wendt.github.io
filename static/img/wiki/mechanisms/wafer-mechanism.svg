<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .header-text { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .body-text { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .label-text { fill: #f59e0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .housing { fill: #0f172a; stroke: #64748b; stroke-width: 2; }
      .plug { fill: #334155; stroke: #38bdf8; stroke-width: 2; }
      .wafer { fill: #475569; stroke: #94a3b8; stroke-width: 1.5; }
      .spring { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
      .key { fill: #f59e0b; stroke: #d97706; stroke-width: 1.5; }
      .shear-line { stroke: #ef4444; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .arrow { stroke: #f59e0b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-amber); }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#0b1120" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <text x="30" y="38" class="title">Wafer Tumbler Mechanism &amp; Alignment</text>
  <text x="30" y="58" class="subtitle">Single-piece stamped wafer plates with center keyway aperture</text>

  <!-- 1. Locked State (Wafer Protruding) -->
  <g transform="translate(40, 80)">
    <rect width="340" height="290" class="card-bg"/>
    <text x="170" y="28" class="header-text">1. Locked (Wafer Protruding)</text>

    <!-- Outer Cylinder -->
    <rect x="50" y="50" width="240" height="150" class="housing" rx="8"/>
    <!-- Plug Core -->
    <rect x="70" y="70" width="200" height="110" class="plug" rx="6"/>
    <!-- Wafer Plate extending outside plug -->
    <rect x="150" y="55" width="40" height="140" rx="3" class="wafer"/>
    <!-- Center Key Window -->
    <rect x="158" y="105" width="24" height="40" fill="#020617"/>
    <!-- Spring on top -->
    <path d="M 160 55 L 160 62 L 180 67 L 160 72 L 170 78" class="spring"/>

    <!-- Arrows -->
    <line x1="280" y1="58" x2="195" y2="58" class="arrow"/>
    <text x="285" y="62" class="label-text">PROTRUDES INTO HOUSING</text>

    <line x1="280" y1="125" x2="185" y2="125" class="arrow"/>
    <text x="285" y="129" class="label-text">KEY WINDOW</text>

    <text x="170" y="235" class="body-text" text-anchor="middle">Spring pushes wafer into outer shell</text>
    <text x="170" y="255" class="body-text" text-anchor="middle" fill="#ef4444">Plug rotation is mechanically blocked</text>
  </g>

  <!-- 2. Unlocked State (Flush at Shear Line) -->
  <g transform="translate(420, 80)">
    <rect width="340" height="290" class="card-bg"/>
    <text x="170" y="28" class="header-text">2. Key Inserted (Flush Alignment)</text>

    <!-- Outer Cylinder -->
    <rect x="50" y="50" width="240" height="150" class="housing" rx="8"/>
    <!-- Plug Core -->
    <rect x="70" y="70" width="200" height="110" class="plug" rx="6"/>
    <!-- Wafer Plate flush with plug -->
    <rect x="150" y="70" width="40" height="110" rx="3" class="wafer"/>
    <!-- Center Key Window with Key Inside -->
    <rect x="158" y="105" width="24" height="40" fill="#020617"/>
    <rect x="145" y="115" width="50" height="20" class="key" rx="2"/>

    <!-- Shear Line Indicator -->
    <line x1="60" y1="70" x2="280" y2="70" class="shear-line"/>
    <line x1="60" y1="180" x2="280" y2="180" class="shear-line"/>

    <!-- Arrow to flush edge -->
    <line x1="280" y1="70" x2="195" y2="70" class="arrow"/>
    <text x="285" y="74" class="label-text">FLUSH AT SHEAR LINE</text>

    <text x="170" y="235" class="body-text" text-anchor="middle">Key bitting lifts wafer to exact height</text>
    <text x="170" y="255" class="body-text" text-anchor="middle" fill="#38bdf8">Plug rotates freely to actuate cam</text>
  </g>
</svg>
