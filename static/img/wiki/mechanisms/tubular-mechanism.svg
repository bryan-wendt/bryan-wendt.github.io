<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .header-text { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .body-text { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
      .label-text { fill: #f59e0b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .outer-ring { fill: #334155; stroke: #64748b; stroke-width: 2; }
      .plug-ring { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; }
      .center-post { fill: #475569; stroke: #94a3b8; stroke-width: 1.5; }
      .pin { fill: #f59e0b; stroke: #d97706; stroke-width: 1; }
      .pin-chamber { fill: #020617; stroke: #38bdf8; stroke-width: 1; }
      .arrow { stroke: #f59e0b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-amber); }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    </style>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#0b1120" rx="12" stroke="#1e293b" stroke-width="2"/>
  
  <text x="30" y="38" class="title">Tubular &amp; Radial Pin Mechanism</text>
  <text x="30" y="58" class="subtitle">Axial pin chambers arranged in a circle around a solid central post</text>

  <!-- Left: Face View -->
  <g transform="translate(40, 80)">
    <rect width="340" height="290" class="card-bg"/>
    <text x="170" y="28" class="header-text">Face View &amp; Pin Arrangement</text>

    <!-- Circular Lock Face -->
    <g transform="translate(170, 125)">
      <!-- Outer Hull -->
      <circle cx="0" cy="0" r="75" class="outer-ring"/>
      <!-- Rotating Plug Ring -->
      <circle cx="0" cy="0" r="58" class="plug-ring"/>
      <!-- Central Solid Post -->
      <circle cx="0" cy="0" r="28" class="center-post"/>
      
      <!-- Key Alignment Notch -->
      <rect x="-6" y="-75" width="12" height="18" fill="#020617" stroke="#f59e0b" stroke-width="1.5"/>

      <!-- 7 Radial Pin Chambers -->
      <circle cx="0" cy="-42" r="7" class="pin-chamber"/>
      <circle cx="34" cy="-25" r="7" class="pin-chamber"/>
      <circle cx="41" cy="14" r="7" class="pin-chamber"/>
      <circle cx="18" cy="38" r="7" class="pin-chamber"/>
      <circle cx="-18" cy="38" r="7" class="pin-chamber"/>
      <circle cx="-41" cy="14" r="7" class="pin-chamber"/>
      <circle cx="-34" cy="-25" r="7" class="pin-chamber"/>
    </g>

    <!-- Alignment Notch Arrow -->
    <line x1="75" y1="52" x2="160" y2="52" class="arrow"/>
    <text x="70" y="48" class="label-text" text-anchor="end">ALIGNMENT NOTCH</text>

    <!-- Center Post Arrow -->
    <line x1="75" y1="125" x2="140" y2="125" class="arrow"/>
    <text x="70" y="121" class="label-text" text-anchor="end">SOLID CENTER POST</text>

    <text x="170" y="235" class="body-text" text-anchor="middle">7 or 8 circular pin positions</text>
    <text x="170" y="255" class="body-text" text-anchor="middle" fill="#38bdf8">Vulnerable to tubular impression picks</text>
  </g>

  <!-- Right: Side Cutaway View -->
  <g transform="translate(420, 80)">
    <rect width="340" height="290" class="card-bg"/>
    <text x="170" y="28" class="header-text">Side Cutaway &amp; Axial Shear Line</text>

    <g transform="translate(60, 60)">
      <!-- Stationary Outer Casing -->
      <rect x="0" y="10" width="100" height="110" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <!-- Rotating Front Plug -->
      <rect x="100" y="10" width="80" height="110" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Axial Shear Line (Vertical between hull and plug) -->
      <line x1="100" y1="0" x2="100" y2="130" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3"/>

      <!-- Upper Pin Chamber (Axial) -->
      <rect x="40" y="25" width="60" height="14" fill="#38bdf8" stroke="#0284c7"/>
      <rect x="100" y="25" width="45" height="14" fill="#f59e0b" stroke="#d97706"/>

      <!-- Lower Pin Chamber (Axial) -->
      <rect x="40" y="80" width="60" height="14" fill="#38bdf8" stroke="#0284c7"/>
      <rect x="100" y="80" width="45" height="14" fill="#f59e0b" stroke="#d97706"/>
    </g>

    <!-- Shear Line Arrow -->
    <line x1="280" y1="70" x2="165" y2="70" class="arrow"/>
    <text x="285" y="74" class="label-text">AXIAL SHEAR LINE</text>

    <text x="170" y="235" class="body-text" text-anchor="middle">Pins travel parallel to key insertion</text>
    <text x="170" y="255" class="body-text" text-anchor="middle" fill="#f59e0b">All depths must align at vertical plane</text>
  </g>
</svg>
